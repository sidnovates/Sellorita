# Sellorita Target Infrastructure Inventory
# For local testing on this machine, use localhost with local connection.
# When targeting a remote cloud VM (AWS/GCP/DigitalOcean), replace with the public IP and SSH key.

[sellorita_servers]
# Local deployment target:
sellorita-node-01 ansible_host=127.0.0.1 ansible_connection=local

# Example Remote target (uncomment when deploying to cloud VM):
# sellorita-prod ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/sellorita_key

[sellorita_servers:vars]
ansible_python_interpreter=/usr/bin/python3
