---
# Tasks for role: common
# Prepares the OS, installs core utilities, configures kernel parameters, and ensures Docker is ready.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

# --- Disable Swap (Mandatory requirement for Kubernetes) ---------------------
- name: Disable active swap
  ansible.builtin.command:
    cmd: swapoff -a
  changed_when: false

- name: Remove swap entry from /etc/fstab to persist across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

# --- Kernel Modules & Networking for Containers -------------------------------
- name: Load required kernel modules for container networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ kernel_modules }}"
  ignore_errors: true

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Configure sysctl parameters for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
  loop: "{{ sysctl_settings }}"
  notify: apply sysctl
  ignore_errors: true

# --- Docker & Containerd Setup -----------------------------------------------
- name: Ensure Docker service is installed and started
  ansible.builtin.package:
    name:
      - docker.io
    state: present

- name: Ensure Docker and containerd services are enabled and running
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - docker
  ignore_errors: true
