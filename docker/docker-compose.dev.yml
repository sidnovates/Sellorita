# Lightweight docker-compose for local development
# Spins up only the stateful dependencies (PostgreSQL, Redis, MinIO)
# Run locally: docker compose -f docker/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: sellorita-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellorita_db
      POSTGRES_USER: sellorita
      POSTGRES_PASSWORD: sellorita_dev
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellorita -d sellorita_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sellorita-dev-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sellorita-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sellorita
      MINIO_ROOT_PASSWORD: sellorita_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: sellorita-dev-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 sellorita sellorita_dev;
      /usr/bin/mc mb myminio/sellorita-media || true;
      exit 0;
      "

volumes:
  dev_postgres_data:
  dev_redis_data:
  dev_minio_data:
