services:
  # --- Database -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sellorita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sellorita_db
      POSTGRES_USER: sellorita
      POSTGRES_PASSWORD: sellorita_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sellorita-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellorita -d sellorita_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache & Task Broker ---------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sellorita-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sellorita-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Object Storage (MinIO) ------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: sellorita-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sellorita
      MINIO_ROOT_PASSWORD: sellorita_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sellorita-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Automated bucket initialization for MinIO
  createbuckets:
    image: minio/mc:latest
    container_name: sellorita-createbuckets
    networks:
      - sellorita-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 sellorita sellorita_dev;
      /usr/bin/mc mb myminio/sellorita-media || true;
      exit 0;
      "

  # --- One-Shot Database Migration Runner ------------------------------------
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sellorita-migrate
    environment:
      APP_ENV: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sellorita_db
      POSTGRES_USER: sellorita
      POSTGRES_PASSWORD: sellorita_dev
    networks:
      - sellorita-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      if command -v alembic > /dev/null && [ -f alembic.ini ]; then
        echo 'Running Alembic database migrations...';
        alembic upgrade head;
      else
        echo 'Alembic migrations not yet committed by Dev A - skipping for now.';
        exit 0;
      fi
      "

  # --- Backend API Gateway ---------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sellorita-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      LOG_JSON: "true"
      MOCK_MODE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sellorita_db
      POSTGRES_USER: sellorita
      POSTGRES_PASSWORD: sellorita_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: sellorita
      MINIO_ROOT_PASSWORD: sellorita_dev
      MINIO_BUCKET: sellorita-media
    networks:
      - sellorita-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Agent & Video Render Worker -------------------------------------------
  agent-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: sellorita-agent-worker
    restart: unless-stopped
    shm_size: "512m" # Vital for Chrome frame buffers in headless rendering
    environment:
      APP_ENV: local
      LOG_JSON: "true"
      MOCK_MODE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sellorita_db
      POSTGRES_USER: sellorita
      POSTGRES_PASSWORD: sellorita_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ROOT_USER: sellorita
      MINIO_ROOT_PASSWORD: sellorita_dev
      MINIO_BUCKET: sellorita-media
    networks:
      - sellorita-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Frontend Review Dashboard (Deferred to Phase 2) -----------------------
  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.frontend
  #   container_name: sellorita-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   networks:
  #     - sellorita-network
  #   depends_on:
  #     - api-gateway

networks:
  sellorita-network:
    name: sellorita-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
