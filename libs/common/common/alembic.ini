# Alembic configuration. Run it through `sellorita-migrate` (see common/migrate.py), which
# passes this file with -c, so it works from any directory.
#
# The database URL is NOT stored here: env.py reads it from Settings (environment
# variables), the same as the services.

[alembic]
script_location = %(here)s/migrations
# 20261125_0001_initial_schema.py: sortable by date, readable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40

[post_write_hooks]
# Format newly generated migrations with ruff (dev machines only; `revision` command).
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
