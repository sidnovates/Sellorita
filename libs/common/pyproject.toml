[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sellorita-common"
version = "0.1.0"
description = "Shared settings, logging, schemas, DB models and storage clients for Sellorita services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
include = ["common*"]
