<!doctype html>
<!-- Sample 6-second 1080x1920 Reel, shaped like what the ReelProductionAgent's LLM will author:
     brand colours, a hook line, a product image, an offer and a CTA, animated with GSAP. -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --brand-primary: #7b2d26; --brand-secondary: #f4c95d; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--brand-primary); }
    #stage { position: relative; width: 1080px; height: 1920px; font-family: "Liberation Sans", sans-serif; color: #fff; }
    .clip { position: absolute; left: 0; width: 100%; text-align: center; }
    #hook { top: 220px; font-size: 96px; font-weight: 700; padding: 0 60px; line-height: 1.1; }
    #product { top: 560px; left: 190px; width: 700px; height: 700px; object-fit: cover;
               border-radius: 48px; border: 12px solid var(--brand-secondary); }
    #offer { top: 1340px; font-size: 120px; font-weight: 800; color: var(--brand-secondary); }
    #cta { top: 1560px; left: 240px; width: 600px; padding: 36px 0; border-radius: 80px;
           background: var(--brand-secondary); color: var(--brand-primary); font-size: 64px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="spike" data-start="0" data-duration="6"
       data-width="1080" data-height="1920">
    <h1 id="hook" class="clip" data-start="0" data-duration="6" data-track-index="0">Diwali treats, freshly baked</h1>
    <img id="product" class="clip" data-start="0.5" data-duration="5.5" data-track-index="1" src="product.jpg" alt="">
    <div id="offer" class="clip" data-start="2" data-duration="4" data-track-index="2">20% OFF</div>
    <div id="cta" class="clip" data-start="3" data-duration="3" data-track-index="3">Order now</div>
  </div>

  <script src="gsap.min.js"></script>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.from("#hook",    { opacity: 0, y: -80, duration: 0.8, ease: "power3.out" }, 0)
      .from("#product", { opacity: 0, scale: 0.6, duration: 1.0, ease: "back.out(1.6)" }, 0.5)
      .from("#offer",   { opacity: 0, scale: 2, duration: 0.6, ease: "power2.out" }, 2)
      .from("#cta",     { opacity: 0, y: 120, duration: 0.6, ease: "power3.out" }, 3)
      .to("#cta",       { scale: 1.08, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, 3.8);
    window.__timelines = window.__timelines || {};
    window.__timelines.spike = tl;
  </script>
</body>
</html>
